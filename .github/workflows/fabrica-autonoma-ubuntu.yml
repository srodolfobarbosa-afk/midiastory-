name: Fábrica Autônoma Ubuntu 24/7 (Operação em Nuvem)

on:
  schedule:
    # Executa a cada 30 minutos na nuvem mesmo com o PC desligado (100% gratuito)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Tipo de ciclo (build, seo, full)'
        required: false
        default: 'full'

concurrency:
  group: autonomous-factory-ubuntu
  cancel-in-progress: false

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restaurar Credenciais & Segredos
        env:
          AI_MEDIA_KEYS: ${{ secrets.AI_MEDIA_KEYS_JSON }}
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ADMIN_KEY: ${{ secrets.FIREBASE_ADMIN_KEY_JSON }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p .secrets
          echo "$AI_MEDIA_KEYS" > .secrets/ai-media-keys.json
          echo "$PLAY_ACCOUNT" > .secrets/play-service-account.json
          echo "$FIREBASE_ADMIN_KEY" > .secrets/firebase-admin.json
          mkdir -p .agents/plugins/supabase
          cat <<EOF > .agents/plugins/supabase/mcp_config.json
          {
            "mcpServers": {
              "supabase": {
                "command": "npx",
                "args": ["-y", "@supabase/mcp-server-supabase@latest", "--project-ref=usmqtnlsaavxqguwrtix"],
                "env": {
                  "SUPABASE_ACCESS_TOKEN": "$SUPABASE_TOKEN"
                }
              }
            }
          }
          EOF
          chmod 600 .secrets/*.json

      - name: Configurar Git para Commits Autônomos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Executar Ciclo Construtor da Fábrica Autônoma (LLM + Supabase)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FIREBASE_ADMIN_KEY_JSON: ${{ secrets.FIREBASE_ADMIN_KEY_JSON }}
        run: |
          node scripts/fabrica-autonoma-24h.mjs --once

      - name: Sincronizar Alterações com o GitHub
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Alterações pendentes detectadas. Sincronizando com remote..."
            git add docs/ scripts/
            git commit -m "feat(cloud-ubuntu): ciclo autônomo executado com sucesso na nuvem" || echo "Sem novidades para commit"
            git push origin HEAD || echo "Push já atualizado"
          else
            echo "Nenhuma alteração pendente de commit."
          fi
