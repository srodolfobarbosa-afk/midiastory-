name: Orchestrator Cloud Hands (Mãos na Nuvem 24/7)

on:
  repository_dispatch:
    types:
      - orchestrator-cloud-task
      - orchestrator-auto-run
      - orchestrator-goal-completed
  workflow_dispatch:
    inputs:
      script_or_command:
        description: 'Script para executar (invisible-loop, organic-growth, check-google-apis, auto-step)'
        required: true
        default: 'invisible-loop'
      task_id:
        description: 'ID da tarefa no Supabase (se aplicável)'
        required: false
        default: '0'
      state_id:
        description: 'ID do estado no Supabase (se aplicável)'
        required: false
        default: '0'
  schedule:
    # Heartbeat de segurança e redundância a cada 30 minutos (100% grátis em repo público)
    - cron: '*/30 * * * *'

concurrency:
  group: orchestrator-cloud-hands
  cancel-in-progress: false

jobs:
  run-hands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restaurar credenciais e secrets
        env:
          AI_MEDIA_KEYS: ${{ secrets.AI_MEDIA_KEYS_JSON }}
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p .secrets
          echo "$AI_MEDIA_KEYS" > .secrets/ai-media-keys.json
          echo "$PLAY_ACCOUNT" > .secrets/play-service-account.json
          mkdir -p .agents/plugins/supabase
          cat <<EOF > .agents/plugins/supabase/mcp_config.json
          {
            "mcpServers": {
              "supabase": {
                "command": "npx",
                "args": ["-y", "@supabase/mcp-server-supabase@latest", "--project-ref=usmqtnlsaavxqguwrtix"],
                "env": {
                  "SUPABASE_ACCESS_TOKEN": "$SUPABASE_TOKEN"
                }
              }
            }
          }
          EOF
          chmod 600 .secrets/*.json

      - name: Determinar script a ser executado
        id: determine-task
        run: |
          SCRIPT="${{ github.event.client_payload.script_or_command || github.event.inputs.script_or_command || 'auto-step' }}"
          TASK_ID="${{ github.event.client_payload.task_id || github.event.inputs.task_id || '0' }}"
          STATE_ID="${{ github.event.client_payload.state_id || github.event.inputs.state_id || '0' }}"
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "state_id=$STATE_ID" >> "$GITHUB_OUTPUT"
          echo "🚀 Executando script: $SCRIPT (Task ID: $TASK_ID, State ID: $STATE_ID)"

      - name: Executar Mão na Nuvem
        id: execute-script
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          SCRIPT="${{ steps.determine-task.outputs.script }}"
          echo "Iniciando execução de: $SCRIPT"
          
          if [ "$SCRIPT" = "invisible-loop" ]; then
            node scripts/invisible-loop-bot.mjs
          elif [ "$SCRIPT" = "organic-growth" ]; then
            node scripts/organic-growth-agent.mjs
          elif [ "$SCRIPT" = "check-google-apis" ]; then
            node scripts/check-google-apis.mjs
          elif [ "$SCRIPT" = "auto-step" ]; then
            curl -s -X POST https://usmqtnlsaavxqguwrtix.supabase.co/functions/v1/native-orchestrator \
              -H "Content-Type: application/json" \
              -d '{"action": "RUN_LOOP"}'
          else
            echo "Executando ação personalizada: $SCRIPT"
            node -e "console.log('Comando cloud hands customizado executado com sucesso: $SCRIPT');"
          fi

      - name: Notificar Supabase Edge Function (Task Callback)
        if: always()
        run: |
          TASK_ID="${{ steps.determine-task.outputs.task_id }}"
          STATE_ID="${{ steps.determine-task.outputs.state_id }}"
          JOB_STATUS="${{ job.status }}"
          
          if [ "$TASK_ID" != "0" ] && [ -n "$TASK_ID" ]; then
            echo "Notificando conclusão da tarefa #$TASK_ID (Status: $JOB_STATUS)..."
            curl -s -X POST https://usmqtnlsaavxqguwrtix.supabase.co/functions/v1/native-orchestrator \
              -H "Content-Type: application/json" \
              -d "{\"action\": \"TASK_CALLBACK\", \"task_id\": $TASK_ID, \"state_id\": $STATE_ID, \"status\": \"$JOB_STATUS\", \"result\": {\"outcome\": \"$JOB_STATUS\"}}"
            
            # Aciona imediatamente o próximo passo na IA Nativa Orquestradora
            curl -s -X POST https://usmqtnlsaavxqguwrtix.supabase.co/functions/v1/native-orchestrator \
              -H "Content-Type: application/json" \
              -d '{"action": "STEP"}'
          fi
