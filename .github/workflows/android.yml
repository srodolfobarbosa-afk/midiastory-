name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midiastore-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-debug:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Validate release script and package guards
        shell: bash
        run: |
          bash -n scripts/build_signed_aab.sh
          grep -Fq 'applicationId = "com.rdf112.midiastore"' app/build.gradle.kts
          if grep -RInE 'applicationId[[:space:]]*=.*com\\.rdf112\\.sweep|Set-Content.*applicationId' --include='*.ps1' scripts COMPILAR_TUDO_WINDOWS.ps1; then
            echo "Unsafe legacy package mutation found in Windows scripts." >&2
            exit 1
          fi
      - name: Test and build Debug
        run: >-
          ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented tests on Android API${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Print instrumented test failure details
        if: failure()
        shell: bash
        run: |
          set +e
          for file in $(find app/build/test-results/testDebugUnitTest app/build/outputs/androidTest-results app/build/reports/androidTests -type f -name '*.xml' 2>/dev/null); do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done
      - name: Generate Debug APK checksum
        if: always()
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          fi
      - name: Upload installable Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midiastore-debug-apk-api${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7

  windows-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell build and QA scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '[\\/](build|\.gradle|\.git)[\\/]' }
          if (-not $files) { throw "No PowerShell scripts were found." }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw "PowerShell syntax error in $($file.FullName)"
            }
            Write-Host "OK: $($file.FullName)"
          }

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify-debug, windows-script-validation]
    runs-on: ubuntu-latest
    environment: play-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Restore the owner upload key to runner temp
        env:
          SWEEP_KEYSTORE_BASE64: ${{ secrets.SWEEP_KEYSTORE_BASE64 }}
          MIDIASTORE_RELEASE_APPROVED: ${{ secrets.MIDIASTORE_RELEASE_APPROVED }}
          MIDIASTORE_MAX_PUBLISHED_VERSION_CODE: ${{ secrets.MIDIASTORE_MAX_PUBLISHED_VERSION_CODE }}
          MIDIASTORE_EXPECTED_CERT_SHA256: ${{ secrets.MIDIASTORE_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$SWEEP_KEYSTORE_BASE64"
          key_file="$RUNNER_TEMP/sweep-upload.jks"
          printf '%s' "$SWEEP_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "SWEEP_STORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build, verify signing certificate, and export AAB
        env:
          SWEEP_STORE_PASSWORD: ${{ secrets.SWEEP_STORE_PASSWORD }}
          SWEEP_KEY_ALIAS: ${{ secrets.SWEEP_KEY_ALIAS }}
          SWEEP_KEY_PASSWORD: ${{ secrets.SWEEP_KEY_PASSWORD }}
          MIDIASTORE_RELEASE_APPROVED: ${{ secrets.MIDIASTORE_RELEASE_APPROVED }}
          MIDIASTORE_MAX_PUBLISHED_VERSION_CODE: ${{ secrets.MIDIASTORE_MAX_PUBLISHED_VERSION_CODE }}
          MIDIASTORE_EXPECTED_CERT_SHA256: ${{ secrets.MIDIASTORE_EXPECTED_CERT_SHA256 }}
        run: bash scripts/build_signed_aab.sh
      - uses: actions/upload-artifact@v4
        with:
          name: midiastore-release-aab
          path: |
            app-release.aab
            app-release.aab.sha256
            app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
