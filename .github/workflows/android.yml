name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midiastore-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Test and build Debug
        run: >-
          ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented tests on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Print instrumented test failure details
        if: failure()
        shell: bash
        run: |
          set +e
          for file in $(find app/build/test-results/testDebugUnitTest app/build/outputs/androidTest-results app/build/reports/androidTests -type f -name '*.xml' 2>/dev/null); do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-debug
    runs-on: ubuntu-latest
    environment: play-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Restore the owner upload key to runner temp
        env:
          SWEEP_KEYSTORE_BASE64: ${{ secrets.SWEEP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SWEEP_KEYSTORE_BASE64"
          key_file="$RUNNER_TEMP/sweep-upload.jks"
          printf '%s' "$SWEEP_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "SWEEP_STORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build, verify signing certificate, and export AAB
        env:
          SWEEP_STORE_PASSWORD: ${{ secrets.SWEEP_STORE_PASSWORD }}
          SWEEP_KEY_ALIAS: ${{ secrets.SWEEP_KEY_ALIAS }}
          SWEEP_KEY_PASSWORD: ${{ secrets.SWEEP_KEY_PASSWORD }}
          SWEEP_EXPECTED_CERT_SHA256: ${{ secrets.SWEEP_EXPECTED_CERT_SHA256 }}
        run: bash scripts/build_signed_aab.sh
      - uses: actions/upload-artifact@v4
        with:
          name: midiastore-release-aab
          path: |
            app-release.aab
            app-release.aab.sha256
            app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
