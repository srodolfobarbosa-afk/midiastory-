name: Midiastore CI/CD & Security Pipeline

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'fix/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: midiastore-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. SEGURANÇA E GOVERNANÇA ESTRITA
  # ==========================================
  security-governance:
    name: 🛡️ Auditoria de Segurança & Scoped Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Auditoria de Governança
        run: node scripts/ci-cd-governance-audit.mjs

  # ==========================================
  # 2. TESTES AUTOMATIZADOS ANDROID (CI)
  # ==========================================
  android-ci:
    name: 🧪 Testes Unitários & Compilação Kotlin
    needs: security-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Permissão do Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar Testes de Domínio, App e Gerar APK Debug + Gate AAB < 8 MB
        env:
          SWEEP_KEYSTORE_BASE64: ${{ secrets.SWEEP_KEYSTORE_BASE64 }}
          SWEEP_STORE_PASSWORD: ${{ secrets.SWEEP_STORE_PASSWORD }}
          SWEEP_KEY_ALIAS: ${{ secrets.SWEEP_KEY_ALIAS }}
          SWEEP_KEY_PASSWORD: ${{ secrets.SWEEP_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:assembleDebug
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          if [ -n "$SWEEP_KEYSTORE_BASE64" ] && [ -n "$SWEEP_STORE_PASSWORD" ]; then
            key_file="$RUNNER_TEMP/sweep-upload.jks"
            printf '%s' "$SWEEP_KEYSTORE_BASE64" | base64 --decode > "$key_file"
            chmod 600 "$key_file"
            SWEEP_STORE_FILE="$key_file" ./gradlew --no-daemon :app:bundleRelease
            rm -f "$key_file"
            aab_bytes=$(stat -c%s app/build/outputs/bundle/release/app-release.aab)
            aab_mb=$(awk "BEGIN {printf \"%.2f\", $aab_bytes / 1048576}")
            echo "📦 Signed R8 Release AAB Size: ${aab_bytes} bytes (${aab_mb} MB)"
            if [ "$aab_bytes" -ge 8388608 ]; then
              echo "❌ ERRO: AAB (${aab_bytes} bytes) ultrapassou o teto de 8 MB (8388608 bytes)!" >&2
              exit 1
            fi
            echo "✅ Gate AAB < 8 MB aprovado com folga (${aab_mb} MB)!"
          fi

      - name: Publicar Artefato APK Debug (.debug Lado a Lado)
        uses: actions/upload-artifact@v4
        with:
          name: midiastore-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # 3. DEPLOY AUTOMÁTICO FIREBASE HOSTING (CD)
  # ==========================================
  firebase-cd:
    name: 🚀 Deploy do Funil Web (8 Idiomas)
    needs: android-ci
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')) && !startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar Páginas nos 8 Idiomas & Deploy Firebase
        env:
          FIREBASE_ADMIN_KEY_JSON: ${{ secrets.FIREBASE_ADMIN_KEY_JSON }}
        run: |
          mkdir -p .secrets
          if [ -n "$FIREBASE_ADMIN_KEY_JSON" ]; then
            echo "$FIREBASE_ADMIN_KEY_JSON" > .secrets/firebase-admin.json
            node scripts/firebase-deploy-site.mjs
          else
            echo "Aviso: FIREBASE_ADMIN_KEY_JSON não configurada no repositório. Deploy ignorado."
          fi

  # ==========================================
  # 4. TELEMETRIA E REGISTRO SUPABASE
  # ==========================================
  supabase-telemetry:
    name: 📊 Registro de Telemetria no Supabase
    needs: [security-governance, android-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registrar Status do Pipeline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node -e "
            const status = '${{ job.status }}';
            console.log('Pipeline concluído com status:', status);
          "
