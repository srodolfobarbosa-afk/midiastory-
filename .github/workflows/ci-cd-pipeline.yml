name: Midiastore CI/CD & Security Pipeline

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: midiastore-ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. SEGURANÇA E GOVERNANÇA ESTRITA
  # ==========================================
  security-governance:
    name: 🛡️ Auditoria de Segurança & Scoped Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Auditoria de Governança
        run: node scripts/ci-cd-governance-audit.mjs

  # ==========================================
  # 2. TESTES AUTOMATIZADOS ANDROID (CI)
  # ==========================================
  android-ci:
    name: 🧪 Testes Unitários & Compilação Kotlin
    needs: security-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Permissão do Gradle Wrapper
        run: chmod +x gradlew

      - name: Executar Testes de Domínio e App
        run: ./gradlew --no-daemon :domain:test :app:testDebugUnitTest :app:compileDebugKotlin

  # ==========================================
  # 3. DEPLOY AUTOMÁTICO FIREBASE HOSTING (CD)
  # ==========================================
  firebase-cd:
    name: 🚀 Deploy do Funil Web (8 Idiomas)
    needs: android-ci
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar Páginas nos 8 Idiomas & Deploy Firebase
        env:
          FIREBASE_ADMIN_KEY_JSON: ${{ secrets.FIREBASE_ADMIN_KEY_JSON }}
        run: |
          mkdir -p .secrets
          if [ -n "$FIREBASE_ADMIN_KEY_JSON" ]; then
            echo "$FIREBASE_ADMIN_KEY_JSON" > .secrets/firebase-admin.json
            node scripts/generate-multilang-pages.mjs
            node scripts/firebase-deploy-site.mjs
          else
            echo "Aviso: FIREBASE_ADMIN_KEY_JSON não configurada no repositório. Deploy ignorado."
          fi

  # ==========================================
  # 4. TELEMETRIA E REGISTRO SUPABASE
  # ==========================================
  supabase-telemetry:
    name: 📊 Registro de Telemetria no Supabase
    needs: [security-governance, android-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Registrar Status do Pipeline
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node -e "
            const status = '${{ job.status }}';
            console.log('Pipeline concluído com status:', status);
          "
