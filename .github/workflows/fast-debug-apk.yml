name: Fast Debug APK (Cloud Builder for Physical Moto G84 QA)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/midiastore-release-audit
    paths:
      - 'app/**'
      - 'domain/**'
      - '.github/workflows/fast-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: fast-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Assemble Debug APK (7 GB Cloud Runner)
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload Fast Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: midiastore-fast-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-signed-release-aab:
    runs-on: ubuntu-latest
    environment: play-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Restore the owner upload key to runner temp
        env:
          SWEEP_KEYSTORE_BASE64: ${{ secrets.SWEEP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SWEEP_KEYSTORE_BASE64"
          key_file="$RUNNER_TEMP/sweep-upload.jks"
          printf '%s' "$SWEEP_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "SWEEP_STORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build, verify signing certificate, and export Release AAB
        env:
          SWEEP_STORE_PASSWORD: ${{ secrets.SWEEP_STORE_PASSWORD }}
          SWEEP_KEY_ALIAS: ${{ secrets.SWEEP_KEY_ALIAS }}
          SWEEP_KEY_PASSWORD: ${{ secrets.SWEEP_KEY_PASSWORD }}
          MIDIASTORE_RELEASE_APPROVED: ${{ secrets.MIDIASTORE_RELEASE_APPROVED }}
          MIDIASTORE_MAX_PUBLISHED_VERSION_CODE: ${{ secrets.MIDIASTORE_MAX_PUBLISHED_VERSION_CODE }}
          MIDIASTORE_EXPECTED_CERT_SHA256: ${{ secrets.MIDIASTORE_EXPECTED_CERT_SHA256 }}
        run: bash scripts/build_signed_aab.sh
      - uses: actions/upload-artifact@v4
        with:
          name: midiastore-release-aab
          path: |
            app-release.aab
            app-release.aab.sha256
            app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
